name: Update zero-day data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ambil dan analisis data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python collector/collect.py

      - name: Commit jika ada perubahan
        run: |
          git config user.name "zeroday-bot"
          git config user.email "zeroday-bot@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X ours || true
            git push
          fi
